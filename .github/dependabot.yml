version: 2

# Keeps the workflow actions and dependencies from going stale unnoticed; the
# deprecated Node 20 actions this repo ran on for a year were never flagged.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply chain: a release must be a week old before it is proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # @babel/core and @babel/preset-env only work on the same major, so
      # one PR for all of Babel (two separate PRs were both red).
      babel:
        patterns: ["@babel/*"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
