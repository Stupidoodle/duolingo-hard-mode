name: Chrome Web Store auth

# Regenerates CHROME_REFRESH_TOKEN without anyone needing a copy of the client
# secret. It is already stored on this repository, so the exchange happens here
# and the new refresh token is written straight back into the secret — it is
# never displayed, and never leaves Actions.
#
# Two runs:
#   1. step: url    -> prints a consent link. Open it, approve, copy the code.
#   2. step: exchange, code: <the code> -> swaps it for a refresh token.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "url (start here), then exchange"
        required: true
        type: choice
        options: [url, exchange]
        default: url
      code:
        description: "Authorization code, only for step=exchange"
        required: false
        type: string

env:
  # Out-of-band (urn:ietf:wg:oauth:2.0:oob) was shut down by Google in 2022
  # and now returns redirect_uri_mismatch. Desktop OAuth clients accept any
  # loopback port instead. Nothing has to be listening on it — the code comes
  # back in the address bar.
  REDIRECT_URI: http://localhost:8910

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Build the consent link
        if: inputs.step == 'url'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        run: |
          # The URL must carry the client id, and GitHub masks it in the log
          # because it is held as a secret — which is why printing it yields ***
          # and opening that gives 401 invalid_client.
          #
          # An OAuth client id is a public identifier: it appears in the address
          # bar of every consent screen Google shows, and Google documents it as
          # not secret. Only the client secret is sensitive, and it is not used
          # in this step. So the URL goes into an artifact, which is not masked.
          URL="https://accounts.google.com/o/oauth2/auth?response_type=code&scope=https://www.googleapis.com/auth/chromewebstore&client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&access_type=offline&prompt=consent"
          printf '%s\n' "$URL" > consent-url.txt
          echo "Consent link written to the consent-link artifact on this run."
          echo "Open it, approve, and the browser will fail to load localhost:8910."
          echo "That is expected. Copy the code= value out of the address bar and"
          echo "re-run this workflow with step=exchange and that code."

      - name: Upload the consent link
        if: inputs.step == 'url'
        uses: actions/upload-artifact@v7
        with:
          name: consent-link
          path: consent-url.txt
          retention-days: 1

      - name: Exchange the code for a refresh token
        if: inputs.step == 'exchange'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          AUTH_CODE: ${{ inputs.code }}
          REDIRECT_URI: ${{ env.REDIRECT_URI }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$AUTH_CODE" ]; then
            echo "step=exchange needs the code input."
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "code=$AUTH_CODE" \
            -d "grant_type=authorization_code" \
            -d "redirect_uri=$REDIRECT_URI" \
            "https://oauth2.googleapis.com/token")

          REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token // empty')

          if [ -z "$REFRESH_TOKEN" ]; then
            echo "No refresh token returned."
            echo "$RESPONSE" | jq -r '"error: \(.error // "unknown")\ndescription: \(.error_description // "none")"'
            echo "invalid_grant usually means the code was already used or has expired;"
            echo "they are single-use and short-lived, so get a fresh one with step=url."
            exit 1
          fi

          echo "::add-mask::$REFRESH_TOKEN"
          echo "$REFRESH_TOKEN" | gh secret set CHROME_REFRESH_TOKEN --repo "$REPO"
          echo "CHROME_REFRESH_TOKEN updated."
          echo "Next: set CHROME_PUBLISHER_ID, then run publish-store.yml with tag v1.4.2."
