name: Chrome Web Store auth

# Regenerates CHROME_REFRESH_TOKEN without anyone needing a copy of the client
# secret. It is already stored on this repository, so the exchange happens here
# and the new refresh token is written straight back into the secret — it is
# never displayed, and never leaves Actions.
#
# Two runs:
#   1. step: url    -> prints a consent link. Open it, approve, copy the code.
#   2. step: exchange, code: <the code> -> swaps it for a refresh token.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "device (recommended), url, or exchange"
        required: true
        type: choice
        options: [device, url, exchange, publisher]
        default: device
      code:
        description: "Authorization code, only for step=exchange"
        required: false
        type: string

env:
  # Out-of-band (urn:ietf:wg:oauth:2.0:oob) was shut down by Google in 2022
  # and now returns redirect_uri_mismatch. Desktop OAuth clients accept any
  # loopback port instead. Nothing has to be listening on it — the code comes
  # back in the address bar.
  REDIRECT_URI: http://localhost:8910

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and store the publisher id
        if: inputs.step == 'publisher'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TOKEN=$(curl -s -X POST \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" -d "grant_type=refresh_token" \
            "https://oauth2.googleapis.com/token" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then echo "Token refresh failed."; exit 1; fi
          echo "::add-mask::$TOKEN"

          # The publisher id normally comes from the dashboard. Many Google APIs
          # accept "-" as a wildcard for a parent collection and return the real
          # resource name, which embeds the id. A read-only status call is
          # enough to find out whether this one does.
          for CANDIDATE in "-" "me"; do
            RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://chromewebstore.googleapis.com/v2/publishers/$CANDIDATE/items/$EXTENSION_ID:fetchStatus")
            NAME=$(echo "$RESPONSE" | jq -r '.name // empty')
            echo "publishers/$CANDIDATE -> ${NAME:-$(echo "$RESPONSE" | jq -c '.error // {}' )}"

            PUBLISHER=$(echo "$NAME" | sed -n 's#^publishers/\([^/]*\)/items/.*#\1#p')
            if [ -n "$PUBLISHER" ] && [ "$PUBLISHER" != "-" ] && [ "$PUBLISHER" != "me" ]; then
              printf '%s' "$PUBLISHER" | gh secret set CHROME_PUBLISHER_ID --repo "$REPO"
              echo "CHROME_PUBLISHER_ID set to $PUBLISHER"
              exit 0
            fi
          done

          echo "The API did not resolve the publisher id from a wildcard."
          echo "It has to be copied from Developer Dashboard > Publisher > Settings."
          exit 1

      - name: Approve with a short code
        if: inputs.step == 'device'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # The device flow never puts the client id in front of the user, so
          # nothing here has to be unmasked. They get a short code instead.
          START=$(curl -s -X POST \
            -d "client_id=$CLIENT_ID" \
            -d "scope=https://www.googleapis.com/auth/chromewebstore" \
            "https://oauth2.googleapis.com/device/code")

          DEVICE_CODE=$(echo "$START" | jq -r '.device_code // empty')
          USER_CODE=$(echo "$START" | jq -r '.user_code // empty')
          VERIFY=$(echo "$START" | jq -r '.verification_url // .verification_uri // empty')
          INTERVAL=$(echo "$START" | jq -r '.interval // 5')

          if [ -z "$DEVICE_CODE" ]; then
            echo "Could not start the device flow."
            echo "$START" | jq -r '"error: \(.error // "unknown")\ndescription: \(.error_description // "none")"'
            echo
            echo "invalid_client here means this OAuth client is not of type"
            echo "\"TV and Limited Input devices\". Use step=url instead."
            exit 1
          fi

          echo "::add-mask::$DEVICE_CODE"
          echo "=============================================="
          echo " Go to:   $VERIFY"
          echo " Enter:   $USER_CODE"
          echo "=============================================="
          echo "Approve with the account that owns the store listing."
          echo "Waiting up to 10 minutes..."

          for _ in $(seq 1 120); do
            sleep "$INTERVAL"
            RESPONSE=$(curl -s -X POST \
              -d "client_id=$CLIENT_ID" \
              -d "client_secret=$CLIENT_SECRET" \
              -d "device_code=$DEVICE_CODE" \
              -d "grant_type=urn:ietf:params:oauth:grant-type:device_code" \
              "https://oauth2.googleapis.com/token")

            REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token // empty')
            if [ -n "$REFRESH_TOKEN" ]; then
              echo "::add-mask::$REFRESH_TOKEN"
              echo "$REFRESH_TOKEN" | gh secret set CHROME_REFRESH_TOKEN --repo "$REPO"
              echo "CHROME_REFRESH_TOKEN updated."
              exit 0
            fi

            ERR=$(echo "$RESPONSE" | jq -r '.error // empty')
            case "$ERR" in
              authorization_pending|slow_down) ;;
              *) echo "Device flow failed: $ERR"
                 echo "$RESPONSE" | jq -r '.error_description // empty'
                 exit 1 ;;
            esac
          done

          echo "Timed out waiting for approval."
          exit 1

      - name: Build the consent link
        if: inputs.step == 'url'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        run: |
          # The URL must carry the client id, and GitHub masks it in the log
          # because it is held as a secret — which is why printing it yields ***
          # and opening that gives 401 invalid_client.
          #
          # An OAuth client id is a public identifier: it appears in the address
          # bar of every consent screen Google shows, and Google documents it as
          # not secret. Only the client secret is sensitive, and it is not used
          # in this step. So the URL goes into an artifact, which is not masked.
          URL="https://accounts.google.com/o/oauth2/auth?response_type=code&scope=https://www.googleapis.com/auth/chromewebstore&client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&access_type=offline&prompt=consent"
          printf '%s\n' "$URL" > consent-url.txt
          echo "Consent link written to the consent-link artifact on this run."
          echo "Open it, approve, and the browser will fail to load localhost:8910."
          echo "That is expected. Copy the code= value out of the address bar and"
          echo "re-run this workflow with step=exchange and that code."

      - name: Upload the consent link
        if: inputs.step == 'url'
        uses: actions/upload-artifact@v4
        with:
          name: consent-link
          path: consent-url.txt
          retention-days: 1

      - name: Exchange the code for a refresh token
        if: inputs.step == 'exchange'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          AUTH_CODE: ${{ inputs.code }}
          REDIRECT_URI: ${{ env.REDIRECT_URI }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$AUTH_CODE" ]; then
            echo "step=exchange needs the code input."
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "code=$AUTH_CODE" \
            -d "grant_type=authorization_code" \
            -d "redirect_uri=$REDIRECT_URI" \
            "https://oauth2.googleapis.com/token")

          REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token // empty')

          if [ -z "$REFRESH_TOKEN" ]; then
            echo "No refresh token returned."
            echo "$RESPONSE" | jq -r '"error: \(.error // "unknown")\ndescription: \(.error_description // "none")"'
            echo "invalid_grant usually means the code was already used or has expired;"
            echo "they are single-use and short-lived, so get a fresh one with step=url."
            exit 1
          fi

          echo "::add-mask::$REFRESH_TOKEN"
          echo "$REFRESH_TOKEN" | gh secret set CHROME_REFRESH_TOKEN --repo "$REPO"
          echo "CHROME_REFRESH_TOKEN updated."
          echo "Next: set CHROME_PUBLISHER_ID, then run publish-store.yml with tag v1.4.2."
