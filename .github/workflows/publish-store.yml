name: Publish to Chrome Web Store

# Split out of release.yml so a failed or expired publish can be retried against
# an existing tag. Re-running release.yml cannot do that: it dies on
# "already_exists" when it recreates the GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.4.1"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern extension.zip --clobber
          unzip -l extension.zip | tail -3

      - name: Refresh access token
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token" \
            "https://oauth2.googleapis.com/token")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            # Print only the error fields; the response can carry a token.
            echo "Token refresh failed."
            echo "$RESPONSE" | jq -r '"error: \(.error // "unknown")\ndescription: \(.error_description // "none")"'
            echo "invalid_grant means CHROME_REFRESH_TOKEN must be regenerated."
            echo "If the OAuth consent screen is still in Testing, Google expires refresh tokens after 7 days."
            exit 1
          fi

          # Keep the token out of the logs. Without this it is printed verbatim
          # in the env block of every later step.
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Show the item's store status
        env:
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          # Informational only: shows whether a submission is still in review,
          # which is the usual reason an upload is refused.
          curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus" \
            | jq '{publishedItemRevisionStatus, submittedItemRevisionStatus, lastAsyncUploadState, takenDown, warned}' || true

      - name: Upload the package
        env:
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          # No --fail-with-body: under bash -e a failing command substitution
          # aborts the step before the body is printed, which hides the store's
          # reason. The status code is appended instead and checked below.
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload")
          HTTP_STATUS=${RESPONSE##*$'\n'}
          RESPONSE=${RESPONSE%$'\n'*}

          echo "HTTP $HTTP_STATUS"
          echo "$RESPONSE" | jq -c '{uploadState, itemError, error}' || echo "$RESPONSE"
          STATE=$(echo "$RESPONSE" | jq -r '.uploadState // empty')

          # v2 reports a finished upload as SUCCEEDED (v1.1 said SUCCESS), and a
          # large one can come back UPLOAD_IN_PROGRESS, which has to be polled.
          if [ "$STATE" = "UPLOAD_IN_PROGRESS" ]; then
            for _ in $(seq 1 30); do
              sleep 5
              STATE=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus" \
                | jq -r '.lastAsyncUploadState // empty')
              echo "upload state: $STATE"
              [ "$STATE" != "UPLOAD_IN_PROGRESS" ] && break
            done
          fi

          case "$STATE" in
            SUCCEEDED|SUCCESS) echo "Upload complete." ;;
            *) echo "Upload did not succeed (uploadState=${STATE:-none})."; exit 1 ;;
          esac

      - name: Publish the item
        env:
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Length: 0" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish")
          HTTP_STATUS=${RESPONSE##*$'\n'}
          RESPONSE=${RESPONSE%$'\n'*}

          echo "HTTP $HTTP_STATUS"
          echo "$RESPONSE" | jq '.' || echo "$RESPONSE"

          # v2 answers with an ItemState. Anything that leaves the item submitted
          # or live is success; REJECTED and CANCELLED are not.
          STATE=$(echo "$RESPONSE" | jq -r '.state // empty')
          case "$STATE" in
            PENDING_REVIEW|STAGED|PUBLISHED|PUBLISHED_TO_TESTERS)
              echo "Publish state: $STATE"
              echo "Google's review can take hours to days before the listing updates." ;;
            *)
              echo "Publish did not succeed (state=${STATE:-none})."
              exit 1 ;;
          esac
