name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # jest and webpack still run on Node; bun installs and drives them.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test

      - name: Build production bundle
        run: bun run build

      # Mozilla's addons-linter, the check AMO runs on every upload.
      - name: Lint the Firefox package
        run: |
          bun scripts/build-firefox.js
          bun x web-ext@10.7.0 lint --source-dir build/firefox --warnings-as-errors

      # Coverage is informational; a Codecov outage must not block merges.
      - name: Upload coverage report
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          verbose: true
